<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Jujutsu Kaisen game banner</title>
  <desc id="desc">Anime-inspired action banner featuring a team of characters in a dramatic card-style composition.</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2efe8"/>
      <stop offset="0.55" stop-color="#efe7dc"/>
      <stop offset="1" stop-color="#d8d1c5"/>
    </linearGradient>

    <radialGradient id="darkGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#2a1d32" stop-opacity="0.88"/>
      <stop offset="0.45" stop-color="#1b1a24" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#09090d" stop-opacity="0.1"/>
    </radialGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#c91d2a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#5b0b17" stop-opacity="0.12"/>
    </radialGradient>

    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#paper)"/>
  <rect width="1200" height="400" fill="url(#darkGlow)" opacity="0.7"/>

  <g opacity="0.8">
