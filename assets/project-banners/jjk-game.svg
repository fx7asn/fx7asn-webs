<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">JJK FIGHT premium anime-inspired banner</title>
  <desc id="desc">Original cinematic anime battle banner with layered cursed-energy atmosphere, a premium JJK FIGHT title treatment, and stylized silhouettes inspired by a dramatic Jujutsu Kaisen poster composition.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1016"/>
      <stop offset="0.28" stop-color="#17141c"/>
      <stop offset="0.62" stop-color="#201c2a"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>

    <linearGradient id="creamPaper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#efe8dc"/>
      <stop offset="0.5" stop-color="#e7ded0"/>
      <stop offset="1" stop-color="#cfc3b4"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#af74ff" stop-opacity="0.7"/>
      <stop offset="0.35" stop-color="#522d6f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#120d17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4d5a" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#c9162f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a0d17" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#63b6ff" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#1d3f92" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#070d1b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="smoke" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff8ef" stop-opacity="0.78"/>
      <stop offset="0.35" stop-color="#d9d1cb" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d9d1cb" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur28"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer><feBlend in="SourceGraphic" in2="SourceGraphic" mode="multiply"/></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#05070b" flood-opacity="0.35"/></filter>
    <filter id="shadowGlow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#ff5b75" flood-opacity="0.18"/></filter>

    <linearGradient id="titleStroke" x1="0" x2="1">
      <stop offset="0" stop-color="#f7f0de"/>
      <stop offset="0.25" stop-color="#ffde8b"/>
      <stop offset="0.5" stop-color="#f9f6ee"/>
      <stop offset="0.75" stop-color="#ff9aa5"/>
      <stop offset="1" stop-color="#f2eee8"/>
    </linearGradient>

    <linearGradient id="buttonGrad" x1="0" x2="1">
