<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Jujutsu Kaisen Game</title>
  <desc id="desc">Anime-inspired ensemble battle banner with dramatic ink splashes, midnight-blue fighters, crimson accents, and violet cursed-energy effects.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8dfc9"/><stop offset=".48" stop-color="#c9c4b5"/><stop offset="1" stop-color="#f0e7d0"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111c28"/><stop offset=".55" stop-color="#172638"/><stop offset="1" stop-color="#080f19"/></linearGradient>
    <linearGradient id="redcoat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ed4a3e"/><stop offset="1" stop-color="#8d1d2d"/></linearGradient>
    <linearGradient id="bluecoat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#315777"/><stop offset="1" stop-color="#101c2e"/></linearGradient>
    <radialGradient id="violet"><stop stop-color="#fff5ff"/><stop offset=".18" stop-color="#e9baff"/><stop offset=".48" stop-color="#a24dff" stop-opacity=".8"/><stop offset="1" stop-color="#7533ff" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter>
    <pattern id="grain" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="5" cy="8" r="1" fill="#111722" opacity=".14"/><circle cx="27" cy="22" r="1.3" fill="#111722" opacity=".1"/><path d="M0 34 36 2" stroke="#fff" stroke-opacity=".08"/></pattern>
  </defs>
  <!-- Warm manga-paper field and torn ink panels -->
  <rect width="1200" height="400" fill="url(#paper)"/>
  <path d="M0 0h430L330 55l62 28-91 34 62 34-88 46 63 31-103 43 76 41-91 34 34 54H0z" fill="#101820"/>
  <path d="M1200 0H830l63 42-46 30 88 32-64 39 74 28-53 45 81 27-66 37 78 35-60 38 60 47h215z" fill="#121923"/>
  <path d="M0 0h1200v400H0z" fill="url(#grain)"/>
  <path d="M420 0h360l-76 38 44 31-59 32 72 26-86 48 52 27-93 46 64 34-77 43 26 75H408l65-45-72-31 93-47-58-34 74-43-86-27 56-46-76-29 65-37z" fill="#822a48" opacity=".76"/>
  <path d="M480 0h272l-67 58 47 43-59 42 39 43-71 45 58 37-73 47 33 85H495l46-63-61-38 62-49-43-37 52-43-63-36 49-41-71-41z" fill="#172536" opacity=".84"/>
  <!-- Violet cursed-energy burst -->
  <ellipse cx="602" cy="205" rx="240" ry="150" fill="#a24dff" opacity=".3" filter="url(#glow)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M370 328c93-72 118-192 230-214 88-17 153 38 223 122" stroke="#f1c9ff" stroke-width="4" opacity=".8"/>
    <path d="M398 366c84-109 168-150 262-145 60 3 107 34 165 82" stroke="#b45bff" stroke-width="3" opacity=".8"/>
    <path d="M535 37c37 80 46 144 15 219m105-222c-10 73 4 131 54 192" stroke="#fff1dc" stroke-width="2" opacity=".7"/>
  </g>
  <circle cx="600" cy="205" r="83" fill="url(#violet)" opacity=".68"/>
  <path d="m580 145 18 42 31-36-14 52 40-7-39 31 28 31-48-15-16 45-9-49-41 19 29-37-35-27 45 7z" fill="#f7dcff" opacity=".75"/>
  <!-- Background ensemble silhouettes -->
  <g stroke="#111822" stroke-width="5" stroke-linejoin="round">
    <!-- left fighter -->
    <path d="M30 400c10-88 30-138 78-165l-7-61c-3-31 12-55 38-59 28-4 49 17 51 46l3 55c34 20 57 70 68 184z" fill="url(#bluecoat)"/>
    <path d="M102 143c4-49 37-74 72-64 22 7 37 25 40 51l-35-17-23 23-26-10-25 30z" fill="#171923"/>
    <path d="M109 182c21 10 43 9 66-3" fill="none" stroke="#e9d9c8" stroke-width="3"/>
    <!-- right rear fighter -->
    <path d="M926 400c17-89 46-134 99-158l-5-55c-2-29 14-50 39-52 28-2 47 19 47 47v56c43 21 70 75 82 162z" fill="#35202c"/>
    <path d="M1006 145c5-48 38-75 72-63 25 8 39 28 40 56l-26-14-19 20-25-10-26 26z" fill="#171722"/>
    <path d="M1016 184c19 7 39 5 57-5" fill="none" stroke="#f1c9b9" stroke-width="3"/>
  </g>
  <!-- Foreground lead fighter, bold red collar and dark uniform -->
  <g stroke="#101722" stroke-width="7" stroke-linejoin="round">
    <path d="M70 400c15-96 52-143 134-170-30-28-42-68-30-108 12-42 45-65 86-59 39 6 62 39 60 78-2 36-20 62-50 82 71 20 117 77 131 177z" fill="url(#night)"/>
    <path d="M171 141c-15-54 9-101 52-113 40-11 78 15 93 55-25-14-48-15-69-5l-26 27-26-6z" fill="#101820"/>
    <path d="M179 155c20 8 40 7 59-2m24 7c14 2 24-2 34-10" fill="none" stroke="#eadfd4" stroke-width="4"/>
    <path d="M171 228l50 39 54-41 39 58-54 49-72-17-52 49-47-29 38-77z" fill="url(#redcoat)"/>
    <path d="M174 264c-43 13-67 48-84 91l-38 45h97l65-74z" fill="#18273a"/>
    <path d="M275 280c38 17 67 53 83 105h-96l-28-63z" fill="#101a27"/>
  </g>
  <!-- Second fighter at center, raised hand / technique gesture -->
  <g stroke="#101722" stroke-width="6" stroke-linejoin="round">
    <path d="M475 400c10-77 31-117 79-143-21-26-28-57-19-88 10-34 35-51 68-47 35 4 54 31 52 65-2 28-16 50-39 67 58 20 94 67 105 146z" fill="url(#bluecoat)"/>
    <path d="M533 159c-5-48 20-79 58-80 28-1 48 16 58 46-20-9-37-8-52 1l-24 20-25-8z" fill="#111721"/>
    <path d="M536 177c17 8 33 7 50-1m24 1c10 2 20-1 28-7" fill="none" stroke="#f0ded0" stroke-width="3"/>
    <path d="M516 274c-33-30-48-63-51-101-2-18 7-26 17-22 8 3 13 22 19 39l-2-63c0-16 15-18 20-3l11 54 1-72c1-16 17-15 19 1l5 68 8-53c3-14 17-11 17 3l-2 74c-2 31-12 55-32 78z" fill="#d5b9a6"/>
    <path d="M499 297l65 11 34 92H449z" fill="#16263b"/>
  </g>
  <!-- Small sparks and ink flecks -->
  <g fill="#f4d7ba">
    <path d="m359 70 15 27 31 7-29 8-10 30-5-31-28-12 29-3z"/><path d="m854 88 10 21 24 6-22 6-7 23-5-24-21-8 22-2z"/><circle cx="415" cy="185" r="4"/><circle cx="794" cy="294" r="5"/><circle cx="880" cy="147" r="3"/><circle cx="338" cy="275" r="3"/>
  </g>
  <!-- Compact game title treatment -->
  <g font-family="Arial,sans-serif" font-weight="900">
    <path d="M842 276h292" stroke="#f3d9b7" stroke-width="2" opacity=".8"/>
    <text x="844" y="316" fill="#f3d9b7" font-size="15" letter-spacing="5">CURSED ENERGY • ACTION GAME</text>
    <text x="838" y="367" fill="#fff0d6" stroke="#171923" stroke-width="7" paint-order="stroke" font-size="43" letter-spacing="1">JUJUTSU KAISEN</text>
    <text x="1140" y="367" fill="#c68aff" font-size="18" text-anchor="end" letter-spacing="3">PLAY</text>
  </g>
</svg>
