<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Jujutsu Kaisen fan game</title>
  <desc id="desc">Original anime-inspired fan-game banner with a shadowy fighter, violet and magenta energy, and a glowing energy orb.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090713"/><stop offset=".48" stop-color="#25103d"/><stop offset="1" stop-color="#080a18"/></linearGradient>
    <radialGradient id="energy"><stop stop-color="#fff5ff"/><stop offset=".12" stop-color="#ff8cf1"/><stop offset=".38" stop-color="#df35ff" stop-opacity=".8"/><stop offset="1" stop-color="#8d31ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8eaff"/><stop offset=".28" stop-color="#b9a2ff"/><stop offset=".7" stop-color="#523295"/><stop offset="1" stop-color="#111025"/></linearGradient>
    <linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe981"/><stop offset=".55" stop-color="#fff1b1"/><stop offset="1" stop-color="#ffce62"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <path d="M0 0h430L208 400H0z" fill="#d42aff" opacity=".1"/>
  <path d="M1200 0H984L710 400h266z" fill="#4d37ff" opacity=".13"/>
  <ellipse cx="280" cy="250" rx="210" ry="185" fill="#e52cff" opacity=".21" filter="url(#glow)"/>
  <ellipse cx="320" cy="260" rx="132" ry="125" fill="url(#energy)"/>
  <circle cx="320" cy="260" r="39" fill="#fff" opacity=".94"/>
  <circle cx="320" cy="260" r="25" fill="#ffb9fb"/>

  <!-- Original abstract energy arcs and shards -->
  <g fill="none" stroke-linecap="round">
    <path d="M-30 320C105 269 132 147 260 111s193 28 243 92" stroke="#fa64e9" stroke-width="5" opacity=".85"/>
    <path d="M-10 362c135-80 194-178 315-179 79-1 135 34 202 86" stroke="#a478ff" stroke-width="3" opacity=".8"/>
    <path d="M24 72c85 69 128 105 170 190M68 35c42 98 68 156 35 230" stroke="#fff0ff" stroke-width="2" opacity=".5"/>
    <path d="M640 72c108 56 136 136 187 237m-110-287c35 107 87 169 199 219" stroke="#e66cff" stroke-width="3" opacity=".6"/>
  </g>
  <g fill="#fff">
    <path d="m94 126 36-19-13 39 36-3-50 38 11-35z" opacity=".7"/>
    <path d="m468 78 22-12-8 26 26 1-37 18 7-22z" opacity=".58"/>
    <path d="m738 93 23-10-12 25 25 4-37 13 9-21z" opacity=".65"/>
  </g>

  <!-- Original, non-character-specific fighter silhouette -->
  <path d="M740 400c20-79 51-124 103-155-27-33-36-67-27-110 12-55 59-91 113-87 55 4 91 45 93 98 2 38-15 72-44 97 76 25 139 77 179 157H740z" fill="url(#figure)"/>
  <path d="M813 151c-13-52 10-103 61-120 44-15 98 8 121 51-32-14-61-14-88-5 12 14 18 28 20 44-25-17-48-23-73-14-15 5-28 20-41 44z" fill="#f7f0ff"/>
  <path d="M828 151c24-22 52-28 85-18" fill="none" stroke="#f15af3" stroke-width="7" stroke-linecap="round"/>
  <path d="M849 192c18-14 40-16 60-7" fill="none" stroke="#1c1536" stroke-width="8" stroke-linecap="round"/>
  <path d="M866 217c10 6 22 7 34 2" fill="none" stroke="#20152f" stroke-width="4" stroke-linecap="round"/>
  <path d="M795 274c59 22 119 23 188-3M782 312c57 26 133 31 214 2" fill="none" stroke="#d7c9ff" stroke-width="5" opacity=".6"/>
  <path d="M728 291c-64 8-126-2-179-42 26 51 84 89 148 101M1000 280c47-5 91-25 128-58-15 56-55 95-115 117" fill="#a145ff" opacity=".22"/>

  <!-- Title composition intentionally differs from the reference artwork -->
  <text x="64" y="78" fill="#d6b3ff" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="7">A FAN-MADE ACTION GAME</text>
  <path d="M64 96h230" stroke="#c05bff" stroke-width="3"/>
  <text x="57" y="179" fill="url(#type)" stroke="#1a1025" stroke-width="8" paint-order="stroke" font-family="Arial,sans-serif" font-size="62" font-weight="900" letter-spacing="-1">JUJUTSU</text>
  <text x="61" y="247" fill="url(#type)" stroke="#1a1025" stroke-width="8" paint-order="stroke" font-family="Arial,sans-serif" font-size="68" font-weight="900" letter-spacing="1">KAISEN</text>
  <text x="68" y="292" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="8">CURSED ENERGY. YOUR MOVE.</text>
  <rect x="65" y="319" width="243" height="39" rx="19" fill="#8b3cf6" stroke="#d9a8ff" stroke-width="1.5"/>
  <text x="186" y="345" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3">ENTER THE FIGHT</text>
  <path d="M64 374h455" stroke="#a94cff" stroke-width="2" opacity=".7"/>
</svg>