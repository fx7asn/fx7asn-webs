    <radialGradient id="glow"><stop stop-color="#ff52e5" stop-opacity=".9"/><stop offset=".45" stop-color="#8b3dff" stop-opacity=".48"/><stop offset="1" stop-color="#6c2cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4eaff"/><stop offset=".28" stop-color="#a789ff"/><stop offset=".68" stop-color="#4420a0"/><stop offset="1" stop-color="#100b22"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
