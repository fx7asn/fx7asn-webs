<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Jujutsu Kaisen Game — Cursed Clash</title>
  <desc id="desc">A manga-inspired Jujutsu Kaisen battle poster with bold title lettering and a five-character sorcerer lineup in dramatic violet and crimson light.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070812"/><stop offset=".52" stop-color="#17102d"/><stop offset="1" stop-color="#05060d"/></linearGradient>
    <radialGradient id="aura" cx="72%" cy="46%" r="53%"><stop stop-color="#d9c7ff" stop-opacity=".95"/><stop offset=".16" stop-color="#9c5cff" stop-opacity=".85"/><stop offset=".42" stop-color="#5424c7" stop-opacity=".48"/><stop offset="1" stop-color="#160b2c" stop-opacity="0"/></radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2eaff"/><stop offset=".28" stop-color="#c49aff"/><stop offset=".7" stop-color="#7c3cff"/><stop offset="1" stop-color="#4814a6"/></linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34304b"/><stop offset=".5" stop-color="#151421"/><stop offset="1" stop-color="#06070d"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2d5"/><stop offset="1" stop-color="#ad7793"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="7" cy="12" r="1" fill="#fff" opacity=".17"/><circle cx="52" cy="33" r="1" fill="#cbb2ff" opacity=".16"/><circle cx="28" cy="72" r="1.2" fill="#fff" opacity=".12"/><circle cx="78" cy="81" r=".8" fill="#fff" opacity=".14"/></pattern>
    <linearGradient id="panelFade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#090812"/><stop offset=".55" stop-color="#090812" stop-opacity=".72"/><stop offset="1" stop-color="#090812" stop-opacity="0"/></linearGradient>
  </defs>

