  <text x="80" y="461" fill="#f4efff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8">JJK FIGHT</text>
  <text x="81" y="501" fill="#b9aecb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3">ENTER THE CURSED BATTLE</text>
