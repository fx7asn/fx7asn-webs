<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Jujutsu Kaisen Game — Cursed Clash</title>
  <desc id="desc">A high-impact anime-inspired battle poster with a sorcerer silhouette, violet cursed energy, and bold JJK Fight lettering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070812"/><stop offset=".52" stop-color="#17102d"/><stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="aura" cx="72%" cy="46%" r="53%">
      <stop stop-color="#d9c7ff" stop-opacity=".95"/><stop offset=".16" stop-color="#9c5cff" stop-opacity=".85"/><stop offset=".42" stop-color="#5424c7" stop-opacity=".48"/><stop offset="1" stop-color="#160b2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2eaff"/><stop offset=".28" stop-color="#c49aff"/><stop offset=".7" stop-color="#7c3cff"/><stop offset="1" stop-color="#4814a6"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#25243a"/><stop offset=".5" stop-color="#11121e"/><stop offset="1" stop-color="#05060b"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffe2d5"/><stop offset="1" stop-color="#ad7793"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="12" r="1" fill="#fff" opacity=".17"/><circle cx="52" cy="33" r="1" fill="#cbb2ff" opacity=".16"/><circle cx="28" cy="72" r="1.2" fill="#fff" opacity=".12"/><circle cx="78" cy="81" r=".8" fill="#fff" opacity=".14"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 0h1200v675H0z" fill="url(#aura)"/>
  <path d="M0 0h1200v675H0z" fill="url(#grain)"/>

  <!-- cursed-energy halo -->
  <g fill="none" stroke-linecap="round">
    <circle cx="852" cy="322" r="245" stroke="#9c5cff" stroke-width="2" opacity=".25"/>
    <circle cx="852" cy="322" r="211" stroke="#d5b9ff" stroke-width="1" stroke-dasharray="3 13" opacity=".5"/>
    <path d="M644 91c104-81 278-82 386 3M661 551c111 85 277 72 377-5" stroke="#b98bff" stroke-width="4" opacity=".45"/>
    <path d="M790 61l24 107m176-79-53 105m165 14-99 47m-339 233 108-70m277 95-76-97" stroke="#e9d8ff" stroke-width="3" opacity=".5"/>
  </g>
  <path d="M0 493 407 0h32L80 675H0zm448 182L996 0h24L493 675z" fill="#8a44ff" opacity=".12"/>

  <!-- energy flares behind the fighter -->
  <g filter="url(#glow)" opacity=".78">
    <path d="M838 103c70 52 123 119 141 208-59-41-91-69-119-122-28 79-75 135-151 181 34-106 49-190 129-267z" fill="#9c5cff"/>
    <path d="M1018 271c-60 57-112 98-204 116 71 28 128 62 175 128-6-94 12-167 29-244z" fill="#6327e8"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M698 422c96-82 163-171 201-291m-169 318c94-52 179-129 249-231m-197 288c108-32 196-86 277-168" stroke="#d8c0ff" stroke-width="5" opacity=".85"/>
    <path d="M736 455c98-117 144-206 167-327m-84 325c92-72 162-145 216-234" stroke="#fff" stroke-width="1.5" opacity=".8"/>
  </g>

  <!-- anime-inspired sorcerer silhouette -->
  <g>
    <!-- shoulders and uniform -->
    <path d="M689 675c12-113 40-175 100-207 42-23 84-31 139-22 81 13 126 86 149 229H689z" fill="url(#coat)" stroke="#7961a8" stroke-width="3"/>
    <path d="M842 446l-47 99 72 130h111l30-135-74-101z" fill="#11111b"/>
    <path d="M795 546l76 39-41 90-71-75zm213-43-79 52 36 117 67-36z" fill="#27213b"/>
    <path d="M850 465l34 45 38-41 35 42-39 160h-63l-41-154z" fill="#080911" stroke="#a783ed" stroke-width="2"/>
    <path d="M882 515l22 24 22-24 13 145h-69z" fill="#171321"/>
    <!-- neck / face -->
    <path d="M842 309c-4-78 32-132 92-134 62-2 97 49 87 129l-15 93c-12 44-48 72-83 70-40-3-69-39-75-84z" fill="url(#skin)"/>
    <path d="M838 311c-13-91 28-166 94-177 69-11 122 42 111 133-22-20-42-42-56-70-29 34-75 56-149 58z" fill="#eee9ff"/>
    <path d="M860 275c10-55 41-96 81-112-23 38-27 63-24 95-16-9-33-10-57 17zm81-113c42 7 70 34 88 71-28-14-49-20-74-15 9-17 1-37-14-56zm36 118c22-30 43-42 68-43-6 28-23 50-52 64z" fill="#c9b9f1"/>
    <!-- blindfold and face detail -->
    <path d="M842 297c48-17 118-24 177-3l-9 42c-53-15-111-10-159 12z" fill="#12111e"/>
    <path d="M851 304c53-13 104-17 158-3" fill="none" stroke="#b895f1" stroke-width="3" opacity=".8"/>
    <path d="M925 384c13 10 30 11 43 2" fill="none" stroke="#713c68" stroke-width="3" stroke-linecap="round"/>
    <path d="M896 432c19 11 49 13 68 2" fill="none" stroke="#754b75" stroke-width="3" opacity=".7"/>
    <!-- raised hand -->
    <path d="M725 380c-5-23 8-44 25-53l41-23 17 20-30 23 48-21 13 20-46 31 39-10 10 22-67 29-31 2z" fill="url(#skin)" stroke="#f4c8ee" stroke-width="3"/>
    <path d="M755 365l37-21m-22 40 39-19m-24 38 36-17" fill="none" stroke="#81527e" stroke-width="3" stroke-linecap="round"/>
    <path d="M774 317l14-26 15 8-12 31" fill="url(#skin)" stroke="#f4c8ee" stroke-width="2"/>
    <path d="M805 329c30-13 49-17 72-12" fill="none" stroke="#d8baff" stroke-width="4" opacity=".9"/>
  </g>

  <!-- foreground impact slash -->
  <path d="M594 496 1200 281" stroke="#c45bff" stroke-width="26" opacity=".27" filter="url(#soft)"/>
  <path d="M578 506 1200 283" stroke="#f2e9ff" stroke-width="3" opacity=".9"/>
  <path d="M596 520 1200 303" stroke="#a95aff" stroke-width="8" opacity=".8"/>

  <!-- title panel -->
  <path d="M0 0h585l-43 675H0z" fill="#080912" opacity=".78"/>
  <path d="M548 0h5L510 675h-5z" fill="#b885ff" opacity=".9"/>
  <path d="M0 0h12v675H0z" fill="#9c5cff"/>
  <text x="76" y="116" fill="#c9a8ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="7">CURSED ENERGY // 01</text>
  <text x="69" y="266" fill="#fff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="100" font-weight="900" letter-spacing="-5">JUJUTSU</text>
  <text x="69" y="365" fill="url(#violet)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="100" font-weight="900" letter-spacing="-4">KAISEN</text>
  <path d="M78 402h360" stroke="#a66bff" stroke-width="4"/>
  <text x="80" y="461" fill="#f4efff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="8">JJK FIGHT</text>
  <text x="81" y="501" fill="#b9aecb" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" letter-spacing="3">ENTER THE CURSED BATTLE</text>
  <g transform="translate(81 548)">
    <rect width="176" height="48" rx="4" fill="#8b45f5"/>
    <path d="M22 15l18 9-18 10z" fill="#fff"/>
    <text x="54" y="31" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="2">PLAY NOW</text>
  </g>
  <text x="80" y="642" fill="#766a8b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3">ANIME-INSPIRED ACTION GAME</text>
  <g transform="translate(1105 44)" fill="none" stroke="#cbb0ff" opacity=".8">
    <path d="M0 0h42v42H0z" stroke-width="2"/><path d="M11 11l20 20m0-20L11 31" stroke-width="2"/>
  </g>
</svg>
