<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Jujutsu Kaisen Game — Play Now</title>
  <desc id="desc">Jujutsu Kaisen action-game banner with a prominent Play Now arcade-style button in the lower-left corner.</desc>
  <image href="https://raw.githubusercontent.com/fx7asn/fx7asn-webs/fba11dd7896ce2df0d2eddaf86422d138706df51/assets/project-banners/jjk-game.svg" width="1200" height="400" preserveAspectRatio="xMidYMid slice" />
  <defs>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5364" />
      <stop offset="1" stop-color="#a41642" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur" />
      <feOffset dy="4" result="offset" />
      <feComponentTransfer><feFuncA type="linear" slope=".55" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <g font-family="Arial,sans-serif" font-weight="900" filter="url(#shadow)">
    <path d="M31 315 47 299h201l17 17v50l-16 17H47l-16-16z" fill="#101722" stroke="#f3d9b7" stroke-width="3" />
    <path d="M41 318 53 306h185l14 13v43l-13 13H53l-12-12z" fill="url(#button)" stroke="#ffcfb0" stroke-width="2" />
    <path d="m63 326 20 17-20 17z" fill="#fff2df" />
    <text x="94" y="337" fill="#ffe8d1" font-size="11" letter-spacing="3">ENTER THE FIGHT</text>
    <text x="94" y="360" fill="#fff" font-size="22" letter-spacing="1">PLAY NOW</text>
    <path d="M231 327v27" stroke="#ffd5c1" stroke-width="2" opacity=".8" />
  </g>
</svg>
